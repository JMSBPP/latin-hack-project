[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

# Remappings for OpenZeppelin
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Polkadot/Paseo TestNet Configuration
[rpc_endpoints]
paseo = "https://testnet-passet-hub-eth-rpc.polkadot.io"

[etherscan]
paseo = { key = "${PASEO_API_KEY}", url = "https://blockscout-passet-hub.parity-testnet.parity.io/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
